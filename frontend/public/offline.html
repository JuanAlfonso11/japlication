<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JobPilot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    min-height: 100dvh;
    padding: 24px;
    text-align: center;
    background: linear-gradient(135deg, #9c79ff 0%, #6d28f5 45%, #3d1a8a 100%);
    overflow: hidden;
  }

  /* -- Mascot: JobPilot's copilot, wearing the aviator goggles the name
        implies. Here he's awake but can't find the server, so the eyes are
        open and the mouth is worried — the sibling page served on :3001
        (scripts/offline-page/offline.html) uses the sleeping version, so
        the two states are distinguishable at a glance: "off on purpose"
        vs "can't reach it". -- */
  .stage {
    position: relative;
    width: 172px;
    height: 172px;
    animation: bob 3.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }
  .stage svg { width: 100%; height: 100%; }

  h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
  }
  p {
    margin: 8px 0 0;
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    max-width: 320px;
    line-height: 1.55;
  }
  ul {
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    max-width: 300px;
    line-height: 1.6;
    text-align: left;
  }
  li { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; }
  li::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffb02e;
    margin-top: 7px;
  }

  .checking {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.62);
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage, .dot { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 120 120" aria-label="El copiloto de JobPilot, buscando el servidor" role="img">
      <ellipse cx="60" cy="110" rx="30" ry="5" fill="rgba(0,0,0,0.18)"/>
      <rect x="17" y="52" width="15" height="31" rx="7.5" fill="#4a1cad"/>
      <rect x="88" y="52" width="15" height="31" rx="7.5" fill="#4a1cad"/>
      <circle cx="60" cy="62" r="38" fill="#ffffff"/>
      <path d="M22 58 A38 38 0 0 1 98 58 Z" fill="#4a1cad"/>
      <rect x="21" y="54" width="78" height="7" rx="3.5" fill="#5b1fd6"/>
      <rect x="40" y="38" width="40" height="7" rx="3.5" fill="#b74b06"/>
      <circle cx="42" cy="41" r="12" fill="#ffb02e" stroke="#b74b06" stroke-width="3"/>
      <circle cx="78" cy="41" r="12" fill="#ffb02e" stroke="#b74b06" stroke-width="3"/>
      <circle cx="38.5" cy="37.5" r="3.5" fill="#fff" opacity="0.55"/>
      <circle cx="74.5" cy="37.5" r="3.5" fill="#fff" opacity="0.55"/>
      <circle cx="49" cy="72" r="4.2" fill="#2a3042"/>
      <circle cx="71" cy="72" r="4.2" fill="#2a3042"/>
      <circle cx="50.5" cy="70.5" r="1.5" fill="#fff"/>
      <circle cx="72.5" cy="70.5" r="1.5" fill="#fff"/>
      <ellipse cx="38" cy="80" rx="6" ry="4" fill="#ffb02e" opacity="0.35"/>
      <ellipse cx="82" cy="80" rx="6" ry="4" fill="#ffb02e" opacity="0.35"/>
      <path d="M54 88 q6 -6 12 0" fill="none" stroke="#2a3042" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <div>
    <h1>JobPilot no se puede conectar</h1>
    <p>Esta pantalla vive dentro de la app, así que aparece incluso sin conexión al servidor. Revisa:</p>
    <ul>
      <li>Que Tailscale esté conectado en tu teléfono (su interruptor activo).</li>
      <li>Que la PC con JobPilot esté encendida.</li>
    </ul>
  </div>

  <div class="checking">
    <span class="dot"></span>
    Reintentando…
  </div>

  <script>
    // This page is bundled INTO the app (loaded from file:///android_asset,
    // not from the network) — Capacitor's own server.errorPath mechanism
    // (see capacitor.config.ts) lands here automatically whenever the
    // real server.url fails to load for ANY reason: phone's Tailscale VPN
    // not connected (DNS never resolves), the PC/Docker stack off
    // (connection refused), or just a flaky network (timeout). A plain
    // location.reload() would just reload this same local file — instead,
    // periodically retry the REAL app URL; if it's still unreachable,
    // Capacitor's WebViewClient.onReceivedError bounces back to this same
    // local page automatically, so this keeps retrying on its own with no
    // extra logic needed on that side.
    var REAL_APP_URL = "https://jobpilot.tailb3d4c1.ts.net";
    setTimeout(function () {
      location.href = REAL_APP_URL;
    }, 5000);
  </script>
</body>
</html>
