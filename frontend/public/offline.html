<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JobPilot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    min-height: 100dvh;
    padding: 24px;
    text-align: center;
    background: linear-gradient(135deg, #9c79ff 0%, #6d28f5 45%, #3d1a8a 100%);
    overflow: hidden;
  }

  /* -- Mascota: el gato piloto de JobPilot, desconcertado.
        Sigue volando (la helice gira) pero no encuentra el servidor: cabeza
        ladeada, una oreja caida, ojos desiguales y signos de interrogacion.
        La pagina gemela que sirve serve-offline.ps1 en :3001 usa al mismo
        gato dormido, para cuando el stack se apago a proposito. Mismo
        personaje, dos estados de animo: se distinguen las dos situaciones
        sin leer una palabra.

        El avion va en crema y no en violeta a proposito: sobre este fondo,
        un avion violeta desaparecia y el gato parecia flotar sobre una
        mancha. Negro sobre crema es el maximo contraste posible aqui. -- */
  .stage {
    position: relative;
    width: min(300px, 82vw);
    aspect-ratio: 300 / 210;
    transform-origin: 50% 65%;
    animation: wobble 3.4s ease-in-out infinite;
  }
  .stage svg { width: 100%; height: 100%; display: block; }
  @keyframes wobble {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-6px); }
  }

  /* La helice sigue girando: el avion vuela, solo que a ninguna parte. */
  .prop { transform-origin: 262px 118px; animation: spin 0.5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .marks {
    position: absolute;
    top: 2%;
    right: 10%;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .marks span { position: absolute; opacity: 0; animation: rise 3.6s ease-in infinite; }
  .marks span:nth-child(1) { font-size: 17px; animation-delay: 0s; }
  .marks span:nth-child(2) { font-size: 22px; left: 15px; top: -14px; animation-delay: 0.7s; }
  .marks span:nth-child(3) { font-size: 28px; left: 34px; top: -30px; animation-delay: 1.4s; }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(6px); }
    18%  { opacity: 0.95; }
    70%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-32px); }
  }

  h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
  }
  p {
    margin: 8px 0 0;
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    max-width: 320px;
    line-height: 1.55;
  }
  ul {
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    max-width: 300px;
    line-height: 1.6;
    text-align: left;
  }
  li { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; }
  li::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffb02e;
    margin-top: 7px;
  }

  .checking {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.62);
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage, .dot, .marks span, .prop { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 300 210" role="img" aria-label="El gato piloto de JobPilot, desconcertado porque no encuentra el servidor">
      <ellipse cx="150" cy="192" rx="80" ry="8" fill="rgba(0,0,0,0.20)"/>

      <ellipse cx="120" cy="146" rx="62" ry="12" fill="#c3c8db"/>
      <path d="M62 128 L44 74 L96 122 Z" fill="#eceef5"/>
      <path d="M62 128 L48 84 L78 120 Z" fill="#ffb02e"/>
      <ellipse cx="66" cy="132" rx="26" ry="7" fill="#c3c8db"/>

      <rect x="56" y="112" width="196" height="50" rx="25" fill="#f6f7fb"/>
      <rect x="56" y="150" width="196" height="12" rx="6" fill="#6d28f5" opacity="0.85"/>
      <circle cx="200" cy="132" r="10" fill="#6d28f5" opacity="0.30"/>
      <circle cx="224" cy="132" r="7" fill="#6d28f5" opacity="0.22"/>
      <path d="M252 114 q26 23 0 46 Z" fill="#eceef5"/>
      <g class="prop">
        <rect x="258" y="96" width="8" height="46" rx="4" fill="#3f465c"/>
      </g>
      <circle cx="262" cy="118" r="8" fill="#ffb02e" stroke="#b74b06" stroke-width="2.5"/>
      <ellipse cx="176" cy="166" rx="56" ry="11" fill="#dcdfeb"/>

      <!-- gato, con la cabeza ladeada -->
      <g transform="rotate(-9 146 92)">
        <ellipse cx="146" cy="116" rx="38" ry="22" fill="#151824"/>
        <ellipse cx="176" cy="112" rx="13" ry="7" fill="#232838"/>
        <circle cx="146" cy="84" r="33" fill="#151824"/>
        <!-- la oreja derecha caida es el detalle que dice "no entiendo" -->
        <path d="M120 64 L113 30 L144 55 Z" fill="#151824"/>
        <path d="M172 66 L192 44 L150 56 Z" fill="#151824"/>
        <path d="M124 61 L121 41 L139 57 Z" fill="#f9a8c4" opacity="0.5"/>
        <path d="M171 63 L184 50 L157 57 Z" fill="#f9a8c4" opacity="0.5"/>
        <rect x="118" y="55" width="56" height="10" rx="5" fill="#b74b06"/>
        <circle cx="125" cy="60" r="14" fill="#ffb02e" stroke="#b74b06" stroke-width="3.5"/>
        <circle cx="167" cy="60" r="14" fill="#ffb02e" stroke="#b74b06" stroke-width="3.5"/>
        <circle cx="120" cy="55" r="4.5" fill="#fff" opacity="0.55"/>
        <circle cx="162" cy="55" r="4.5" fill="#fff" opacity="0.55"/>
        <!-- ojos desiguales -->
        <circle cx="134" cy="89" r="9.5" fill="#fff"/>
        <circle cx="159" cy="89" r="7" fill="#fff"/>
        <circle cx="135" cy="90" r="4.6" fill="#151824"/>
        <circle cx="160" cy="90" r="3.6" fill="#151824"/>
        <circle cx="133" cy="87" r="1.8" fill="#fff"/>
        <circle cx="158.5" cy="87.5" r="1.4" fill="#fff"/>
        <path d="M142 99 L150 99 L146 104 Z" fill="#f9a8c4"/>
        <path d="M137 111 q10 -6 19 1" fill="none" stroke="#c3c8db" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M116 92 L96 87 M116 99 L94 100 M176 92 L196 87 M176 99 L198 100"
              stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        <path d="M116 112 q30 13 60 0 l0 11 q-30 12 -60 0 Z" fill="#dd6d02"/>
        <path d="M118 118 q-26 10 -38 30 q17 6 27 -8 Z" fill="#f99207"/>
      </g>

      <!-- borde de la cabina por delante del gato, para que vaya sentado
           dentro y no encima del fuselaje. -->
      <path d="M104 124 q42 22 88 0 l0 16 q-44 20 -88 0 Z" fill="#e3e6f0"/>
      <path d="M104 124 q42 22 88 0" fill="none" stroke="#c3c8db" stroke-width="3"/>
    </svg>
    <div class="marks"><span>?</span><span>?</span><span>?</span></div>
  </div>

  <div>
    <h1>JobPilot no se puede conectar</h1>
    <p>Esta pantalla vive dentro de la app, así que aparece incluso sin conexión al servidor. Revisa:</p>
    <ul>
      <li>Que Tailscale esté conectado en tu teléfono (su interruptor activo).</li>
      <li>Que la PC con JobPilot esté encendida.</li>
    </ul>
  </div>

  <div class="checking">
    <span class="dot"></span>
    Reintentando…
  </div>

  <script>
    // This page is bundled INTO the app (loaded from file:///android_asset,
    // not from the network) — Capacitor's own server.errorPath mechanism
    // (see capacitor.config.ts) lands here automatically whenever the
    // real server.url fails to load for ANY reason: phone's Tailscale VPN
    // not connected (DNS never resolves), the PC/Docker stack off
    // (connection refused), or just a flaky network (timeout). A plain
    // location.reload() would just reload this same local file — instead,
    // periodically retry the REAL app URL; if it's still unreachable,
    // Capacitor's WebViewClient.onReceivedError bounces back to this same
    // local page automatically, so this keeps retrying on its own with no
    // extra logic needed on that side.
    var REAL_APP_URL = "https://jobpilot.tailb3d4c1.ts.net";
    setTimeout(function () {
      location.href = REAL_APP_URL;
    }, 5000);
  </script>
</body>
</html>
