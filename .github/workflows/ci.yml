# CI: las mismas comprobaciones que .githooks/pre-commit, pero en GitHub, en
# cada push a main y en cada PR. El hook se salta cualquier paso cuyo
# contenedor no este corriendo, y `git commit --no-verify` lo apaga entero;
# esto no depende de la maquina de nadie.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Misma imagen que docker-compose.yml. Se llama `db` porque
      # tests/conftest.py fija el host a `db`.
      db:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow
          POSTGRES_DB: jobflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_PASSWORD: jobflow
      PGPASSWORD: jobflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Resolver el host db
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: JWT_SECRET desechable
        # config.py se niega a arrancar con un secreto de ejemplo o corto.
        run: echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Base de pruebas (jobflow_test desde schema.sql)
        run: |
          psql -h db -U jobflow -d jobflow -c "CREATE DATABASE jobflow_test"
          psql -h db -U jobflow -d jobflow_test -v ON_ERROR_STOP=1 -q -f db/schema.sql

      - name: Tests del backend
        working-directory: backend
        run: python -m pytest -q

      - name: Deriva entre schema.sql y las migraciones
        # Igual que scripts/check-schema-drift.ps1. pg_dump corre dentro del
        # contenedor de Postgres para que su version sea la del servidor.
        env:
          DATABASE_URL: postgresql+asyncpg://jobflow:jobflow@db:5432/jobflow
        run: |
          set -e
          for d in drift_from_schema drift_from_migrations; do
            psql -h db -U jobflow -d postgres -q -c "CREATE DATABASE $d"
          done
          psql -h db -U jobflow -d drift_from_schema -v ON_ERROR_STOP=1 -q -f db/schema.sql
          (cd backend && python -m app.scripts.migrate --database drift_from_migrations)
          dump() {
            docker exec ${{ job.services.db.id }} pg_dump -U jobflow -d "$1" \
              --schema-only --no-owner --no-privileges --no-comments -T alembic_version \
              | grep -vE '^\s*(--|$)' | sort
          }
          dump drift_from_schema > /tmp/schema.txt
          dump drift_from_migrations > /tmp/migrations.txt
          if ! diff /tmp/schema.txt /tmp/migrations.txt; then
            echo "::error::DERIVA: '<' solo en schema.sql, '>' solo en las migraciones. Pon el cambio en ambos."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build (incluye type-check)
        run: npm run build
