<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JobPilot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    min-height: 100dvh;
    padding: 24px;
    text-align: center;
    background: linear-gradient(135deg, #9c79ff 0%, #6d28f5 45%, #3d1a8a 100%);
    overflow: hidden;
  }

  /* -- Mascot: JobPilot's copilot, asleep. This page only ever shows when
        the stack was stopped ON PURPOSE from the control panel, so he's
        napping rather than worried — the near-identical page bundled in the
        APK (frontend/public/offline.html) uses the awake, worried version
        for "can't reach the server". Same character, two moods, so the two
        situations are told apart without reading a word. -- */
  .stage {
    position: relative;
    width: 172px;
    height: 172px;
    animation: bob 3.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }
  .stage svg { width: 100%; height: 100%; }

  .zzz {
    position: absolute;
    top: 4px;
    right: 0;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .zzz span { position: absolute; opacity: 0; animation: rise 3.6s ease-in infinite; }
  .zzz span:nth-child(1) { font-size: 15px; animation-delay: 0s; }
  .zzz span:nth-child(2) { font-size: 19px; left: 12px; top: -10px; animation-delay: 0.7s; }
  .zzz span:nth-child(3) { font-size: 24px; left: 26px; top: -22px; animation-delay: 1.4s; }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(6px); }
    18%  { opacity: 0.95; }
    70%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-30px); }
  }

  h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
  }
  p {
    margin: 8px 0 0;
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    max-width: 320px;
    line-height: 1.55;
  }

  .checking {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.62);
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage, .dot, .zzz span { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 120 120" aria-label="El copiloto de JobPilot, durmiendo" role="img">
      <ellipse cx="60" cy="110" rx="30" ry="5" fill="rgba(0,0,0,0.18)"/>
      <rect x="17" y="52" width="15" height="31" rx="7.5" fill="#4a1cad"/>
      <rect x="88" y="52" width="15" height="31" rx="7.5" fill="#4a1cad"/>
      <circle cx="60" cy="62" r="38" fill="#ffffff"/>
      <path d="M22 58 A38 38 0 0 1 98 58 Z" fill="#4a1cad"/>
      <rect x="21" y="54" width="78" height="7" rx="3.5" fill="#5b1fd6"/>
      <rect x="40" y="38" width="40" height="7" rx="3.5" fill="#b74b06"/>
      <circle cx="42" cy="41" r="12" fill="#ffb02e" stroke="#b74b06" stroke-width="3"/>
      <circle cx="78" cy="41" r="12" fill="#ffb02e" stroke="#b74b06" stroke-width="3"/>
      <circle cx="38.5" cy="37.5" r="3.5" fill="#fff" opacity="0.55"/>
      <circle cx="74.5" cy="37.5" r="3.5" fill="#fff" opacity="0.55"/>
      <path d="M42 71 q7 7 14 0" fill="none" stroke="#2a3042" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M64 71 q7 7 14 0" fill="none" stroke="#2a3042" stroke-width="3.2" stroke-linecap="round"/>
      <ellipse cx="38" cy="80" rx="6" ry="4" fill="#ffb02e" opacity="0.35"/>
      <ellipse cx="82" cy="80" rx="6" ry="4" fill="#ffb02e" opacity="0.35"/>
      <path d="M54 85 q6 6 12 0" fill="none" stroke="#2a3042" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="zzz"><span>z</span><span>z</span><span>Z</span></div>
  </div>

  <div>
    <h1>JobPilot está descansando</h1>
    <p>Enciende la aplicación desde tu PC (el botón "Encender" del panel) para seguir buscando empleos.</p>
  </div>

  <div class="checking">
    <span class="dot"></span>
    Revisando si ya está encendida…
  </div>

  <script>
    // Once JobPilot is turned back on, tailscale serve starts pointing this
    // same URL at the real app instead of this static page — a plain
    // reload is all it takes to pick that up, no special detection needed.
    setInterval(function () {
      location.reload();
    }, 5000);
  </script>
</body>
</html>
