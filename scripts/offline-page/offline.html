<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JobPilot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    min-height: 100dvh;
    padding: 24px;
    text-align: center;
    background: linear-gradient(135deg, #9c79ff 0%, #6d28f5 45%, #3d1a8a 100%);
    overflow: hidden;
  }

  /* -- Mascot: the app's own paper-plane mark, parked for the night -- */
  .mascot {
    position: relative;
    width: 140px;
    height: 140px;
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .mark {
    width: 120px;
    height: 120px;
    border-radius: 32px;
    background: rgba(255,255,255,0.14);
    box-shadow: 0 18px 40px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { width: 74px; height: 74px; }

  .zzz {
    position: absolute;
    top: 6px;
    right: -8px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .zzz span {
    position: absolute;
    opacity: 0;
    animation: rise 3.2s ease-in infinite;
  }
  .zzz span:nth-child(1) { font-size: 14px; animation-delay: 0s; }
  .zzz span:nth-child(2) { font-size: 18px; left: 10px; top: -8px; animation-delay: 0.6s; }
  .zzz span:nth-child(3) { font-size: 22px; left: 22px; top: -18px; animation-delay: 1.2s; }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(4px); }
    15%  { opacity: 0.9; }
    70%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-26px); }
  }

  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
  }
  p {
    margin: 6px 0 0;
    font-size: 14px;
    color: rgba(255,255,255,0.78);
    max-width: 320px;
    line-height: 1.5;
  }

  .checking {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="mascot">
    <div class="mark">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M37 12 L21.5 26.5 L26 37 Z" fill="#ffffff" fill-opacity="0.6"/>
        <path d="M37 12 L11 22 L21.5 26.5 Z" fill="#ffffff"/>
      </svg>
    </div>
    <div class="zzz"><span>z</span><span>z</span><span>Z</span></div>
  </div>

  <div>
    <h1>JobPilot está descansando</h1>
    <p>Enciende la aplicación desde tu PC (el botón "Encender" del panel) para seguir buscando empleos.</p>
  </div>

  <div class="checking">
    <span class="dot"></span>
    Revisando si ya está encendida…
  </div>

  <script>
    // Once JobPilot is turned back on, tailscale serve starts pointing this
    // same URL at the real app instead of this static page — a plain
    // reload is all it takes to pick that up, no special detection needed.
    setInterval(function () {
      location.reload();
    }, 5000);
  </script>
</body>
</html>
