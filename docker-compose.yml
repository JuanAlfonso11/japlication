services:
  db:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env - generala con python -c 'import secrets; print(secrets.token_urlsafe(32))'}"
      POSTGRES_DB: jobflow
    # No `ports:` on purpose. Postgres is only ever reached from the backend
    # container, over the compose network — publishing 5432 on the host put
    # the database on every interface the host has, which with Tailscale
    # means every node on the tailnet could connect with the credentials
    # that are written in plain text right above. For a psql shell use:
    #     docker compose exec db psql -U jobflow -d jobflow
    volumes:
      - jobflow_db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobflow -d jobflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://jobflow:${POSTGRES_PASSWORD}@db:5432/jobflow
      # Tambien suelta, solo para la suite de tests: conftest.py construye con
      # ella la URL de jobflow_test, y la tenia escrita a mano como "jobflow".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # `:?` (not `:-`) on purpose: compose refuses to start at all if
      # JWT_SECRET is missing, instead of quietly substituting a value that
      # is published in this file. The backend enforces strength separately
      # in app/core/config.py — this just stops the container from ever
      # booting without one.
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en .env - generalo con python -c 'import secrets; print(secrets.token_urlsafe(48))'}"
      ALLOW_EXTRA_REGISTRATIONS: ${ALLOW_EXTRA_REGISTRATIONS:-1}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-90}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000/api/v1}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@jobflow.ai}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      USAJOBS_API_KEY: ${USAJOBS_API_KEY:-}
      USAJOBS_USER_AGENT: ${USAJOBS_USER_AGENT:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      LINKEDIN_LOCATION: ${LINKEDIN_LOCATION:-Worldwide}
      ANDROID_LATEST_VERSION_CODE: ${ANDROID_LATEST_VERSION_CODE:-}
      ANDROID_LATEST_VERSION_NAME: ${ANDROID_LATEST_VERSION_NAME:-}
      ANDROID_UPDATE_APK_URL: ${ANDROID_UPDATE_APK_URL:-}
      ANDROID_UPDATE_NOTES: ${ANDROID_UPDATE_NOTES:-}
      SYSTEM_HEARTBEAT_SECRET: ${SYSTEM_HEARTBEAT_SECRET:-}
    volumes:
      - ./backend/secrets:/app/secrets:ro
      - ./backend/runtime:/app/runtime
      # Alembic revision 0001 does not carry a frozen snapshot of the schema:
      # it reads db/schema.sql and replays it. Without this mount, migrating a
      # database from empty fails with FileNotFoundError '/db/schema.sql' —
      # which is why only the initdb path (Postgres loading schema.sql itself)
      # ever worked, and the from-scratch path silently never did.
      - ./db:/db:ro
    ports:
      # 127.0.0.1, no 0.0.0.0. Sin el prefijo, Docker publicaba el backend en
      # TODAS las interfaces del host: cualquier equipo de la misma WiFi (casa,
      # hotel, cafe) llegaba a la API sin TLS y sin pasar por Tailscale. El
      # razonamiento ya estaba escrito aqui arriba para Postgres; simplemente
      # no se habia aplicado a los dos servicios que si se publican.
      #
      # No rompe el acceso desde el movil: `tailscale serve` corre en el host y
      # proxea a http://localhost:3000 y :8000 (verificado con `serve status`),
      # asi que sigue alcanzando ambos.
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  jobflow_db_data:
